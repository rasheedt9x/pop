# raylib-android game (see ../raylib-android/NOTES.md)
NAME=pop                # APK file name
LABEL="Pop"             # app name under the icon
PACKAGE=local.pop       # Android package id; changing it makes a separate app
ORIENTATION=portrait    # portrait | landscape | sensorLandscape | fullSensor ...
DEV_PORT=47123          # hot reload server port (127.0.0.1); give each game its own
NETWORK=no              # yes = the release APK may use the internet (kit/net.h); dev builds always can
